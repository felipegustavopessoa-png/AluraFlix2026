<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
        }

        p {
            color: #555;
            font-size: 1.1rem;
        }

        strong {
            color: #e74c3c; /* Destaca a palavra com cor */
        }

        .btn-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn-link:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Bem-vindo ao meu site</h1>
        </header>
        
        <p>Este é um parágrafo sobre <strong>aprendizado</strong>.</p>

        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="btn-link">
            Clique aqui para pesquisar
        </a> 
    </main>

</body>
</html>
